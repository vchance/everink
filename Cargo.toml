[workspace]
resolver = "3"
members = ["crates/everink-core", "crates/everink-sync"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vchance/everink"
publish = false

[workspace.dependencies]
num-bigint = "0.5.1"
num-traits = "0.2.19"
# Test only: a second big-integer library, as an independent reference for the arithmetic.
dashu-int = "0.6.2"
# Example only: socket options for the paced-link run (spike question 8).
socket2 = { version = "0.6.5", features = ["all"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
