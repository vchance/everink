# The storage trial of spike slice 5. A package of its own, outside the workspace, so that SQLite and what it
# brings in never enter the main build or the workspace's lock file. Nothing here is a decision: the storage
# engine is chosen from the results.
[package]
name = "store-trial"
version = "0.0.0"
description = "Everink spike: one SQLite file per room; commit latency and load time."
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
everink-core = { path = "../../crates/everink-core" }
everink-sync = { path = "../../crates/everink-sync" }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
lz4_flex = "=0.14.0"
blake3 = "=1.8.7"
crc32c = "=0.6.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
