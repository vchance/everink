# The renderer trial of spike slice 3b. A package of its own, outside the workspace, so that the renderer and
# what it brings in never enter the main build or the workspace's lock file.
[package]
name = "render-trial"
version = "0.0.0"
description = "Everink spike: tile raster rate of vello_gpu and vello_cpu on a scene of stroke outlines."
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
everink-core = { path = "../../crates/everink-core" }
vello_gpu = "=0.4.0"
vello_cpu = "=0.4.0"
vello_common = "=0.4.0"
wgpu = "=30.0.2"
pollster = "=1.0.1"
i_overlay = "=9.1.0"
png = "=0.18.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
