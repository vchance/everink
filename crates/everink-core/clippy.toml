# Geometry that every client must compute identically may use only arithmetic that is the same on every target
# (docs/design/01-positions.md, "Float rules"): + - * /, sqrt, abs, comparisons, floor, ceil, trunc,
# round_ties_even, casts and bit operations. Everything else a float can do is listed here and refused, for f64
# and f32: the functions whose results differ between targets or library versions, and the ones whose rounding
# or treatment of NaN is not fixed. A use outside shared geometry (a display value, a test) says so with
# `#[allow(clippy::disallowed_methods)]` and a reason.
disallowed-methods = [
    { path = "f64::mul_add", reason = "fused multiply-add rounds once, plain arithmetic twice" },
    { path = "f64::sin", reason = "not the same on every target; use arithmetic or a table of literals" },
    { path = "f64::cos", reason = "not the same on every target; use arithmetic or a table of literals" },
