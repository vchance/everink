# Product CI (core D2). A first `changes` job decides what runs: on a pull request or a push it maps the changed
# paths to components (.github/scripts/ci-changes.sh, in the order of PROFILE.md › Check selection); on the hourly
# schedule it is the integration lane, which runs every job on the branch head unless that head is already covered
# (.github/scripts/ci-lane.py). `ci-result` is the one required check: it fails if any job failed or was canceled,
# or if the lane is carrying an earlier failure on the same head.
# Public repository: every job names a GitHub-hosted label directly, with no placement gate (core D9). Nothing is
# stored on GitHub: no caches, no artifacts (core D11).
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'   # hourly, off the top of the hour; a run that finds the head covered costs only `changes`
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04   # public repository: GitHub-hosted (PROFILE `public: GitHub-hosted`, core D9)
    timeout-minutes: 3
    permissions: { contents: read, actions: read }   # the lane reads earlier runs of this workflow
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      text: ${{ steps.select.outputs.text }}
      render: ${{ steps.select.outputs.render }}
      store: ${{ steps.select.outputs.store }}
      controls: ${{ steps.select.outputs.controls }}
      all: ${{ steps.select.outputs.all }}
      carry_failure: ${{ steps.select.outputs.carry_failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: The lane's decision table still holds
        run: python3 -I .github/scripts/ci-lane.py --self-test
      - id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-changes.sh "$EVENT" "$BEFORE" "$AFTER"

  lint:
    name: lint
    needs: [changes]
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04   # public repository: GitHub-hosted (PROFILE `public: GitHub-hosted`, core D9)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy, warnings are errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: [changes]
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04   # public repository: GitHub-hosted (PROFILE `public: GitHub-hosted`, core D9)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: Tests (x86-64; includes the cross-platform golden files written on aarch64)
        run: cargo test --workspace --locked
      - name: Tests on wasm32 (under Node; the golden files written on aarch64 must pass here too)
        run: |
          node --version
          cargo test -p everink-core --target wasm32-wasip1 --locked
      - name: Golden files with fused multiply-add switched on (x86-64 does not have it on by default)
        env:
          RUSTFLAGS: -C target-feature=+fma
          CARGO_TARGET_DIR: target/fma
        # Optimised as well as not: it is the optimiser that could fuse a multiply and an add.
        run: |
          cargo test -p everink-core --test outlines --test golden --locked
          cargo test --release -p everink-core --test outlines --test golden --locked
      - name: Golden files in an optimised build, natively and on wasm32
        run: |
          cargo test --release -p everink-core --test outlines --test golden --locked
          cargo test --release -p everink-core --test outlines --test golden --target wasm32-wasip1 --locked
      - name: Timing examples build and run
        run: |
          cargo run --release --locked --example bench_positions
          cargo run --release --locked --example bench_cut
          cargo run --release --locked --example bench_object_map
          cargo run --release --locked --example sim_paced_link
      - name: Paced link over real sockets (Linux; no thresholds, the figures are read from the log)
        run: cargo run --release --locked --example paced_link 3 5

  # The text-library trial (spike slice 2b): a package outside the workspace, with the three candidate libraries.
  # It runs only when the trial or the toolchain changes, and on the full runs.
  text-trial:
    name: text-trial
    needs: [changes]
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.text == 'true' }}
    runs-on: ubuntu-24.04   # public repository: GitHub-hosted (PROFILE `public: GitHub-hosted`, core D9)
    timeout-minutes: 20
    env:
      MANIFEST: spike/text-trial/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format check
        run: cargo fmt --manifest-path "$MANIFEST" --check
      - name: Clippy, warnings are errors
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets --locked -- -D warnings
      - name: Tests (what each library does, and damaged bytes)
        run: cargo test --manifest-path "$MANIFEST" --locked
      - name: Size and timing run builds and runs
        run: cargo run --release --locked --manifest-path "$MANIFEST"

  # The renderer trials (spike slices 3b and 3c): two packages outside the workspace, with vello_gpu, vello_cpu
  # and wgpu. spike/render-trial is native; spike/render-web is the same scene for a browser. A hosted runner has
  # no GPU and no browser to drive, so the native trial runs only its processor renderer here and the browser
  # trial is built and linted but not run; their figures are taken on a machine with a GPU. It runs when either
  # trial, the core crate or the toolchain changes, and on the full runs.
  render-trial:
    name: render-trial
    needs: [changes]
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.render == 'true' }}
    runs-on: ubuntu-24.04   # public repository: GitHub-hosted (PROFILE `public: GitHub-hosted`, core D9)
    timeout-minutes: 20
    env:
      MANIFEST: spike/render-trial/Cargo.toml
      WEB: spike/render-web/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format check
        run: cargo fmt --manifest-path "$MANIFEST" --check
      - name: Clippy, warnings are errors
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets --locked -- -D warnings
      - name: The trial builds and runs (2,000 strokes, processor renderer only; no GPU here, so the two renderers are not compared)
        run: cargo run --release --locked --manifest-path "$MANIFEST" 2000
      - name: The browser trial, format check
        run: cargo fmt --manifest-path "$WEB" --check
      - name: The browser trial, clippy for each renderer alone and for all three (wasm32; warnings are errors)
        run: |
          for features in cpu webgl webgpu webgpu,webgl,cpu; do
            cargo clippy --manifest-path "$WEB" --target wasm32-unknown-unknown --features "$features" --locked -- -D warnings
          done
      - name: The browser trial builds (it is run in a browser on a machine with a GPU, not here)
        run: cargo build --release --locked --manifest-path "$WEB" --target wasm32-unknown-unknown --features webgpu,webgl,cpu
      - name: The browser trial builds with WebAssembly SIMD (the build most of its figures come from)
        run: cargo build --release --locked --manifest-path "$WEB" --target wasm32-unknown-unknown --features webgpu,webgl,cpu --target-dir spike/render-web/target/simd
        env:
          RUSTFLAGS: -C target-feature=+simd128

  # The storage trial (spike slice 5): a package outside the workspace, with SQLite (built from source by
  # rusqlite's `bundled` feature), LZ4, BLAKE3 and CRC32C. It builds the two workspace crates in, so it runs when
  # the trial, either crate or the toolchain changes, and on the full runs. Its timing run asserts nothing about
  # time; it fails only if the room it opens is not the room it wrote.
  store-trial:
    name: store-trial
    needs: [changes]
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.store == 'true' }}
    runs-on: ubuntu-24.04   # public repository: GitHub-hosted (PROFILE `public: GitHub-hosted`, core D9)
    timeout-minutes: 20
    env:
      MANIFEST: spike/store-trial/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format check
        run: cargo fmt --manifest-path "$MANIFEST" --check
      - name: Clippy, warnings are errors
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets --locked -- -D warnings
      - name: Tests (the room comes back exactly; a damaged file is refused)
        run: cargo test --manifest-path "$MANIFEST" --locked
      - name: Timing run at 10,000 and 100,000 strokes (no thresholds; the room opened must be the room written)
        run: cargo run --release --locked --manifest-path "$MANIFEST" 10000,100000

  # The controls trial (spike slice 4a): a package outside the workspace, with the two candidate toolkits (egui;
  # taffy and parley for Everink's own). It runs when the trial or the toolchain changes, and on the full runs.
  # Nothing here opens a window; a screen reader and a real keyboard are for a person (part 4b).
  controls-trial:
    name: controls-trial
    needs: [changes]
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.controls == 'true' }}
    runs-on: ubuntu-24.04   # public repository: GitHub-hosted (PROFILE `public: GitHub-hosted`, core D9)
    timeout-minutes: 20
    env:
      MANIFEST: spike/controls-trial/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format check
        run: cargo fmt --manifest-path "$MANIFEST" --check
      - name: Clippy with both candidates, with each alone and with neither (warnings are errors)
        run: |
          cargo clippy --manifest-path "$MANIFEST" --all-targets --locked -- -D warnings
          for features in "" own egui; do
            cargo clippy --manifest-path "$MANIFEST" --all-targets --locked --no-default-features --features "$features" -- -D warnings
          done
      - name: Tests (the same ten for both candidates)
        run: cargo test --manifest-path "$MANIFEST" --locked
      - name: Frame cost and lines of code (no thresholds)
        run: cargo run --release --locked --manifest-path "$MANIFEST" --example bench_controls
      - name: Size of each candidate in a WebAssembly module
        run: sh spike/controls-trial/size.sh

  ci-result:
    name: ci-result
    needs: [changes, lint, test, text-trial, render-trial, store-trial, controls-trial]
    if: ${{ always() }}
    runs-on: ubuntu-24.04   # public repository: GitHub-hosted (PROFILE `public: GitHub-hosted`, core D9)
    timeout-minutes: 2
    env:
      NEEDS: ${{ toJSON(needs) }}
      CARRY_FAILURE: ${{ needs.changes.outputs.carry_failure }}
    steps:
      - name: Fail if any job failed or was canceled, or the lane carries a failure
        run: |
          python3 -c 'import json,os,sys; n=json.loads(os.environ["NEEDS"]); bad=[k for k,v in n.items() if v["result"] in ("failure","cancelled")]; carry=os.environ.get("CARRY_FAILURE")=="true"; print("results:", {k:v["result"] for k,v in n.items()}, "carry_failure:", carry); sys.exit(1 if bad or carry else 0)'
